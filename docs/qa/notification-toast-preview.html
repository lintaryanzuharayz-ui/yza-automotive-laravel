<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YZA — Preview notifikasi</title>
<link rel="stylesheet" href="../../public/assets/css/notification-toasts.css">
<style>body{margin:0;min-height:100vh;background:linear-gradient(120deg,#16171d,#343742);font:14px Arial;color:white}main{padding:24px;max-width:480px}button{padding:10px 15px;border:1px solid #555;border-radius:8px;background:#24252b;color:white;cursor:pointer;margin:4px}p{line-height:1.6;color:#d3d3db}.yza-toast-stack{--yza-toast-top:180px}</style></head><body>
<main><h1>Preview notifikasi YZA</h1><p>Contoh visual saja. Tidak membuat notifikasi atau mengubah data. Arahkan mouse ke popup untuk menjeda timer.</p><button data-example="member">Welcome member</button><button data-example="staff">Welcome staf</button><button data-example="order">Pesanan</button><button data-example="payment">Pembayaran</button><button data-example="booking">Booking</button></main>
<div class="yza-toast-stack" data-yza-toast-stack data-account="preview" aria-live="polite"></div>
<script src="../../public/assets/js/notification-toasts.js"></script>
<script>
const examples={member:{welcome:true,member:true,title:'Selamat Datang Kembali',message:'Nikmati layanan premium YZA Automotive'},staff:{welcome:true,title:'Selamat Bertugas, Administrator',message:'Pantau aktivitas operasional hari ini'},order:{title:'Pesanan Baru Masuk',message:'Ada pesanan kendaraan baru yang perlu diperiksa.',url:location.href},payment:{title:'Pembayaran Terverifikasi',message:'Pembayaran berhasil diverifikasi oleh sistem.'},booking:{title:'Booking Servis Dikonfirmasi',message:'Jadwal servis pelanggan telah dikonfirmasi.'}};
document.querySelectorAll('[data-example]').forEach(button=>button.addEventListener('click',()=>YzaToast.show(examples[button.dataset.example])));
YzaToast.show(examples.member);YzaToast.show(examples.staff);
</script></body></html>
